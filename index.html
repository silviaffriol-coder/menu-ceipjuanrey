<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú do Comedor – CEIP Juan Rey</title>

<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
  h1 { text-align: center; margin-bottom: 30px; }
  .tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
  .tab { padding: 10px 20px; background: #ddd; border-radius: 5px; cursor: pointer; }
  .tab.active { background: #4a90e2; color: white; }
  .menu-box { background: white; padding: 20px; border-radius: 10px; }
</style>
</head>

<body>

<h1>Menú do Comedor – Curso 2026–2027</h1>

<div class="tabs">
  <div class="tab active" onclick="mostrarMenu('basal')">Basal</div>
  <div class="tab" onclick="mostrarMenu('lactosa')">Sen lactosa</div>
  <div class="tab" onclick="mostrarMenu('glute')">Sen glute</div>
  <div class="tab" onclick="mostrarMenu('musulman')">Musulmán</div>
</div>

<div id="menu-hoxe" class="menu-box"></div>

<script>
// ------------------------------------------------------------
// 1) LISTA COMPLETA DE DÍAS NON LECTIVOS
// ------------------------------------------------------------
const nonLectivos = [
  // Antes de comezar o curso
  "2026-09-01","2026-09-02","2026-09-03","2026-09-04","2026-09-05","2026-09-06","2026-09-07","2026-09-08",

  // Festivos nacionais
  "2026-10-12",
  "2026-11-01",
  "2026-12-06",
  "2026-12-08",
  "2027-01-01",
  "2027-01-06",
  "2027-05-01",

  // Festivo autonómico Galicia
  "2027-05-17",

  // Día do Ensino
  "2026-12-07",

  // Vacacións de Nadal (22 dec → 7 xan)
  "2026-12-22","2026-12-23","2026-12-24","2026-12-25","2026-12-26","2026-12-27","2026-12-28","2026-12-29","2026-12-30","2026-12-31",
  "2027-01-01","2027-01-02","2027-01-03","2027-01-04","2027-01-05","2027-01-06","2027-01-07",

  // Entroido
  "2027-02-08","2027-02-09","2027-02-10",

  // Semana Santa (22 → 29 marzo)
  "2027-03-22","2027-03-23","2027-03-24","2027-03-25","2027-03-26","2027-03-27","2027-03-28","2027-03-29",

  // Fin de curso (despois do 21 xuño)
  "2027-06-22","2027-06-23","2027-06-24","2027-06-25","2027-06-26","2027-06-27","2027-06-28","2027-06-29","2027-06-30"
];

// ------------------------------------------------------------
// 2) MENÚS (TI CAMBIAS ESTES TEXTOS CANDO QUEIRAS)
// ------------------------------------------------------------
const menus = {
  basal: {
    primeiro: "Luras á romana",
    segundo: "Tortilla de champiñóns",
    postre: "Froita"
  },
  lactosa: {
    primeiro: "Sopa de verduras",
    segundo: "Polo á prancha",
    postre: "Mazá"
  },
  glute: {
    primeiro: "Crema de cabaciña",
    segundo: "Pescada ao forno",
    postre: "Plátano"
  },
  musulman: {
    primeiro: "Arroz con verduras",
    segundo: "Polo ao curry",
    postre: "Froita fresca"
  }
};

// ------------------------------------------------------------
// 3) DETECTAR HOXE
// ------------------------------------------------------------
const hoxe = new Date();
const hoxeISO = hoxe.toISOString().split("T")[0];
const diaSemana = hoxe.getDay(); // 0 domingo, 6 sábado

// ------------------------------------------------------------
// 4) COMPROBAR SE HOXE É NON LECTIVO
// ------------------------------------------------------------
if (diaSemana === 0 || diaSemana === 6 || nonLectivos.includes(hoxeISO)) {
  document.getElementById("menu-hoxe").innerHTML = `
    <h2>Hoxe non é día lectivo</h2>
    <p>Non hai servizo de comedor.</p>
  `;
} else {
  mostrarMenu('basal');
}

// ------------------------------------------------------------
// 5) CAMBIAR ENTRE MENÚS
// ------------------------------------------------------------
function mostrarMenu(tipo) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[onclick="mostrarMenu('${tipo}')"]`).classList.add('active');

  const m = menus[tipo];
  document.getElementById("menu-hoxe").innerHTML = `
    <h2>Menú ${tipo.charAt(0).toUpperCase() + tipo.slice(1)} de hoxe</h2>
    <p><strong>Primeiro:</strong> ${m.primeiro}</p>
    <p><strong>Segundo:</strong> ${m.segundo}</p>
    <p><strong>Postre:</strong> ${m.postre}</p>
  `;
}
</script>

</body>
</html>
