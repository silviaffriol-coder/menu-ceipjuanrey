<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú do Comedor – CEIP Juan Rey</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <img src="img/foto-colexio.jpg" alt="Foto do colexio" class="selo">
        <h1>Menú do Comedor</h1>
    </header>

    <!-- BOTÓNS COMO ANTES -->
    <nav>
        <button onclick="cambiarMenu('basal')">Basal</button>
        <button onclick="cambiarMenu('sen_lactosa')">Sen lactosa</button>
        <button onclick="cambiarMenu('sen_glute')">Sen glute</button>
        <button onclick="cambiarMenu('musulman')">Musulmán</button>
        <button onclick="cambiarMenu('sen_marisco')">Sen marisco</button>
    </nav>

    <!-- MENÚ DO DÍA -->
    <section id="menuHoxe" class="menu">
        <h2 id="dataHoxe"></h2>

        <div class="prato">
            <h3>Primeiro prato</h3>
            <p id="primeiro"></p>
        </div>

        <div class="prato">
            <h3>Segundo prato</h3>
            <p id="segundo"></p>
        </div>

        <div class="prato">
            <h3>Sobremesa</h3>
            <p id="sobremesa"></p>
        </div>
    </section>

    <!-- PANEL ADMIN -->
    <section id="adminPanel" class="admin oculto">
        <h2>Panel de administración</h2>

        <label for="adminData">Data:</label>
        <input type="date" id="adminData">

        <label for="adminPrimeiro">Primeiro prato:</label>
        <input type="text" id="adminPrimeiro">

        <label for="adminSegundo">Segundo prato:</label>
        <input type="text" id="adminSegundo">

        <label for="adminSobremesa">Sobremesa:</label>
        <input type="text" id="adminSobremesa">

        <button id="gardarMenu">Gardar menú</button>
        <button id="pecharAdmin">Pechar</button>
    </section>

    <script src="menus.js"></script>
    <script src="scripts.js"></script>
    <script src="admin.js"></script>

</body>
</html>
