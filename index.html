<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <title>Menú comedor CEIP Juan Rey 2026-2027</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    h1 { margin-bottom: 0.5rem; }
    .fila { margin-bottom: 1rem; }
    label { font-weight: 600; margin-right: 0.5rem; }
    select, input[type="date"] { padding: 0.3rem 0.4rem; }
    #resultado { margin-top: 1.5rem; border-top: 1px solid #ccc; padding-top: 1rem; }
    .campo { margin-bottom: 0.4rem; }
    .etiqueta { font-weight: 600; }
  </style>
</head>
<body>

  <h1>Menú do comedor 2026-2027</h1>
  <p>Escolle o tipo de menú e a data para ver o prato correspondente.</p>

  <!-- Tipo de menú -->
  <div class="fila">
    <label for="tipoMenu">Tipo de menú:</label>
    <select id="tipoMenu">
      <option value="MENUS_BASAL">Basal</option>
      <option value="MENUS_MUSULMAN">Musulmán</option>
      <option value="MENUS_SEN_GLUTE">Sen glute</option>
      <option value="MENUS_SEN_MARISCO">Sen marisco</option>
      <option value="MENUS_SEN_LACTOSA">Sen lactosa</option>
    </select>
  </div>

  <!-- Data -->
  <div class="fila">
    <label for="dataMenu">Data:</label>
    <input type="date" id="dataMenu">
    <button type="button" onclick="mostrarMenu()">Ver menú</button>
  </div>

  <!-- Resultado -->
  <div id="resultado">
    <div class="campo">
      <span class="etiqueta">Primeiro prato:</span>
      <span id="primeiroPrato">—</span>
    </div>
    <div class="campo">
      <span class="etiqueta">Segundo prato:</span>
      <span id="segundoPrato">—</span>
    </div>
    <div class="campo">
      <span class="etiqueta">Sobremesa:</span>
      <span id="sobremesaPrato">—</span>
    </div>
  </div>

  <!-- Carga do ficheiro menus.js -->
  <script src="menus.js"></script>

  <script>
    function mostrarMenu() {
      const tipo = document.getElementById('tipoMenu').value;
      const data = document.getElementById('dataMenu').value;

      if (!data) {
        alert('Escolle unha data.');
        return;
      }

      const coleccion = {
        MENUS_BASAL,
        MENUS_MUSULMAN,
        MENUS_SEN_GLUTE,
        MENUS_SEN_MARISCO,
        MENUS_SEN_LACTOSA
      }[tipo];

      const menu = coleccion[data];

      if (!menu) {
        document.getElementById('primeiroPrato').textContent = 'Sen menú rexistrado';
        document.getElementById('segundoPrato').textContent = '—';
        document.getElementById('sobremesaPrato').textContent = '—';
        return;
      }

      document.getElementById('primeiroPrato').textContent = menu.primeiro || '—';
      document.getElementById('segundoPrato').textContent = menu.segundo || '—';
      document.getElementById('sobremesaPrato').textContent = menu.sobremesa || '—';
    }
  </script>

</body>
</html>
