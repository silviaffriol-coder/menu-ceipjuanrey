<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú CEIP Juan Rey</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div id="selo" class="selo-colexio">
    <img src="img/foto-colexio.jpg" alt="Colexio">
</div>

<div id="panelAdmin" class="panel-oculto">
    <button id="pecharAdmin">Pechar</button>

    <h2>Panel de Administración</h2>

    <label>Data:</label>
    <input type="date" id="dataSelect">

    <label>Tipo de menú:</label>
    <select id="tipoAdmin">
        <option value="basal">Basal</option>
        <option value="lactosa">Sen lactosa</option>
        <option value="glute">Sen glute</option>
        <option value="musulman">Musulmán</option>
        <option value="marisco">Sen marisco</option>
    </select>

    <label>Primeiro prato:</label>
    <input type="text" id="primeiroInput">

    <label>Segundo prato:</label>
    <input type="text" id="segundoInput">

    <label>Sobremesa:</label>
    <input type="text" id="sobremesaInput">

    <button id="gardarBtn">Gardar</button>
</div>

<div class="menu-dia">
    <h1>Menú de hoxe</h1>
    <p id="primeiroPrato"></p>
    <p id="segundoPrato"></p>
    <p id="sobremesaPrato"></p>
</div>

<script src="menus.js"></script>
<script src="admin.js"></script>
<script src="scripts.js"></script>

</body>
</html>
