<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <title>Menú do Comedor – CEIP Juan Rey</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonte e estilos -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="app">

        <!-- SELLO DO COLEXIO (xesto secreto aquí) -->
        <div class="selo-container">
            <img src="img/foto-colexio.jpg" alt="CEIP Juan Rey" id="selo-colexio">
        </div>

        <header>
            <h1>Menú do Comedor</h1>
            <p class="subtitulo">Curso 2026–2027</p>
        </header>

        <!-- Selectores de tipo de menú -->
        <nav class="selectores">
            <button class="selector active" onclick="mostrarMenu('basal')">Basal</button>
            <button class="selector" onclick="mostrarMenu('lactosa')">Sen lactosa</button>
            <button class="selector" onclick="mostrarMenu('glute')">Sen glute</button>
            <button class="selector" onclick="mostrarMenu('musulman')">Musulmán</button>
        </nav>

        <!-- Caixa principal do menú -->
        <main class="menu-container">
            <h2 id="titulo-menu">Menú Basal de hoxe</h2>
            <div id="menu-box" class="menu-box">
                <!-- Aquí o JS mete a data e o menú -->
            </div>
        </main>

        <footer>
            <p class="footer-text">Actualízase automaticamente segundo a data real.</p>
        </footer>

    </div>

    <!-- Scripts -->
    <script src="menus.js"></script>
    <script src="scripts.js"></script>

</body>
</html>
