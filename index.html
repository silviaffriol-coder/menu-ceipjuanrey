<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú do Comedor – CEIP Juan Rey</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <img src="img/foto-colexio.jpg" alt="Selo do centro" class="selo-img">
        <h1>Menú do Comedor – CEIP Juan Rey</h1>
    </header>

    <main>
        <div id="menuMostrado">
            <h2 id="diaTitulo"></h2>

            <p><strong>Primeiro:</strong> 
                <span id="primeiroMostrado">—</span>
            </p>

            <p><strong>Segundo:</strong> 
                <span id="segundoMostrado">—</span>
            </p>

            <p><strong>Sobremesa:</strong> 
                <span id="sobremesaMostrado">—</span>
            </p>
        </div>
    </main>

    <!-- PANEL ADMIN OCULTO AO INICIO -->
    <div id="panelAdmin" class="panel-oculto">
        <h2>Panel de administración</h2>

        <label for="dataSelect">Data a modificar:</label>
        <input type="date" id="dataSelect">

        <label for="dietaSelect">Dieta:</label>
        <select id="dietaSelect">
            <option value="basal">Basal</option>
            <option value="musulman">Musulmán</option>
            <option value="sen_glute">Sen glute</option>
            <option value="sen_marisco">Sen marisco</option>
            <option value="sen_lactosa">Sen lactosa / baixo fructosa</option>
        </select>

        <label for="primeiroInput">Primeiro prato:</label>
        <input type="text" id="primeiroInput">

        <label for="segundoInput">Segundo prato:</label>
        <input type="text" id="segundoInput">

        <label for="sobremesaInput">Sobremesa:</label>
        <input type="text" id="sobremesaInput">

        <button id="gardarBtn">Gardar menú</button>
        <button id="pecharAdmin">Pechar</button>
    </div>

    <script src="menus.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
