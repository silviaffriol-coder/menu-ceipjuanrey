<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menú CEIP Juan Rey</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="app-container">

    <header class="xunta-header">
        <img src="img/xunta-logo.png" alt="Xunta de Galicia" class="xunta-logo">
        <span class="titulo-app">Menú CEIP Juan Rey</span>
    </header>

    <img src="img/foto-colexio.jpg" alt="CEIP Juan Rey Lourenzá" class="foto-colexio">

    <main>

        <!-- MENÚ DE HOXE -->
        <section class="menu-dia">
            <h2>Menú de hoxe</h2>
            <p class="data" id="data-hoxe"></p>

            <ul class="lista-menu">
                <li><strong>Primeiro:</strong> Sopa de verduras</li>
                <li><strong>Segundo:</strong> Filete de polo á prancha</li>
                <li><strong>Guarnición:</strong> Arroz branco</li>
                <li><strong>Postre:</strong> Froita fresca</li>
            </ul>
        </section>

        <div class="botons">
            <a href="mensual.html" class="btn mensual">Ver Menú Mensual</a>
            <a href="info.html" class="btn info">Información</a>
        </div>

    </main>

    <footer class="pe-app">
        <img src="img/logo-ceip.png" alt="CEIP Juan Rey" class="logo-ceip">
        <p>CEIP Juan Rey – Lourenzá</p>
    </footer>

</div> <!-- PECHA app-container -->
<script>
    const elementoData = document.getElementById("data-hoxe");

    const hoxe = new Date();

    const diasSemana = [
        "Domingo", "Luns", "Martes", "Mércores", "Xoves", "Venres", "Sábado"
    ];

    const meses = [
        "xaneiro", "febreiro", "marzo", "abril", "maio", "xuño",
        "xullo", "agosto", "setembro", "outubro", "novembro", "decembro"
    ];

    const diaSemana = diasSemana[hoxe.getDay()];
    const dia = hoxe.getDate();
    const mes = meses[hoxe.getMonth()];

    elementoData.textContent = `${diaSemana}, ${dia} de ${mes}`;
</script>

</body>

</html>
